<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fluid</title>
  <style>html:not(.ready) #stage { visibility: hidden }</style>
  <script>try { if (localStorage.getItem("fluid:tone") === "blue") document.documentElement.dataset.tone = "blue" } catch (e) {}</script>
</head>
<body>
  <div id="stage">
    <main id="surface" aria-live="polite"></main>
    <section id="still"><h1 id="question">What do you need?</h1></section>
    <footer id="dock">
      <svg id="line" viewBox="0 0 1000 24" preserveAspectRatio="none" aria-hidden="true"><path id="line-path" d="M0 12 H1000"/></svg>
      <form id="intent" autocomplete="off">
        <input id="say" type="text" placeholder="Type or speak" aria-label="Say what you need">
        <button type="button" id="mic" hidden>Speak</button>
        <button type="submit" id="go">Shape</button>
        <button type="button" id="stop" hidden>Stop</button>
      </form>
      <div id="tools">
        <button type="button" id="back" disabled title="Return to the previous form">Back</button>
        <button type="button" id="rest" title="Clear the surface">Clear</button>
        <button type="button" id="keep" hidden title="Keep this form on your shelf">Keep</button>
        <button type="button" id="up" title="Horizon: results, and anything that needs you (Alt+Up)">Horizon</button>
        <button type="button" id="tone" class="tone-toggle" aria-pressed="false" title="Blue water tone">Blue</button>
        <button type="button" id="depth" title="See how this surface is made (Alt+D)">Depth</button>
        <form id="keepform" hidden autocomplete="off">
          <input id="keepname" maxlength="80" aria-label="Name this form" placeholder="Name this form">
          <button type="submit">Keep</button>
          <button type="button" id="keeprepeat" title="Turn what you just did into a playbook you can run again">Make repeatable</button>
          <button type="button" id="keepcancel">Cancel</button>
        </form>
        <span id="whisper" role="status"></span>
      </div>
    </footer>
    <nav id="below" aria-label="Ideas"><ul id="suggest" class="shelf-list"></ul></nav>
  </div>
  <div id="veil" aria-hidden="true"></div>
  <div id="haze" aria-hidden="true"></div>
  <div id="horizon" role="dialog" aria-modal="true" aria-label="Horizon" hidden></div>
  <div id="depths" role="dialog" aria-modal="true" aria-label="Under the surface" hidden></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
